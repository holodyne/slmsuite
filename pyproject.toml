[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slmsuite"
description = "Package for high-performance spatial light modulator (SLM) control and holography."
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Holodyne Labs, Inc.", email = "slmsuite@holodyne.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",
    "h5py",
    "tqdm",
]

# GPU acceleration (CuPy): ``pip install slmsuite[gpu]`` installs cupy-cuda13x.
# Sometimes, installation is made complicated by a pre-installed version of CUDA.
# You can find the CUDA version with ``nvcc --version`` in a terminal, and then
# install an installation of :mod:`cupy` specific to CUDA version ``YY`` with
# ``pip install cupy-cudaYYx``(see https://docs.cupy.dev/en/stable/install.html).
# For example:
#   pip install cupy-cuda12x   # CUDA 12.x
#   pip install cupy            # Build from source (any CUDA version)
#
# Some hardware drivers require vendor-specific SDKs that are not available on
# PyPI. Download the SDK installer from the vendor and follow the installation
# instructions. This might involve installing a wheel .whl or building from source.
#
#   PySpin           — FLIR/Teledyne Spinnaker SDK
#   thorlabs_tsi_sdk — Thorlabs ThorCam SDK
#   vmbpy            — Allied Vision Vimba X SDK
#   vimba            — Allied Vision Vimba SDK (legacy)

[project.optional-dependencies]
gpu = ["cupy-cuda13x"]
torch = ["torch"]
slms = [
    "pyglet",
    "hidapi",
    "pyyaml",
]
cameras = [
    "pylablib",
    "pymmcore",
    "pypylon",
    "instrumental-lib",
]
images = [
    "imageio",
    "pygifsicle",
    "av",
]
jupyter = [
    "jupyter",
    "ipywidgets",
    "ipyevents",
    "slmsuite[images]",
]
docs = [
    "nbsphinx",
    "IPython",
    "docutils",
    "sphinx",
    "sphinx_copybutton",
    "sphinx_last_updated_by_git",
    "requests",
    "pypandoc_binary",     # Bundles the pandoc binary that nbsphinx needs.
    "pydata-sphinx-theme",
    "sphinx_design",
    "sphinx-autodoc-typehints",
]
test = [
    "imageio",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-subtests",
    "pytest-notebook",
    "nbformat",
    "pyyaml",
    "ipywidgets",
]
dev = [
    "slmsuite[test]",
    "slmsuite[jupyter]",
    "slmsuite[docs]",
    "slmsuite[gpu]",
    "slmsuite[torch]",
    "slmsuite[slms]",
    "slmsuite[cameras]",
    "line-profiler",
    "snakeviz",
    "ruff",
]

[project.urls]
"Homepage" = "https://github.com/holodyne/slmsuite"
"Documentation" = "https://slmsuite.holodyne.com/en/latest/"

[tool.setuptools.dynamic]
version = { attr = "slmsuite.__version__" }

[tool.setuptools.packages.find]
include = ["slmsuite*"]

[tool.setuptools.package-data]
slmsuite = [
    "holography/toolbox/phase/cuda.cu",
    "hardware/slms/texasinstruments.yaml",
    "hardware/slms/meadowlark.csv",
]

[tool.uv]
# pyqt5-qt5 >= 5.15.3 dropped Windows wheels; cap to last working version.
constraint-dependencies = ["pyqt5-qt5<=5.15.2"]

[tool.coverage.run]
# Don't include hardware drivers in coverage reports, as we cannot autotest them.
include = [
    "slmsuite/*.py",
    "slmsuite/hardware/_common.py",
    "slmsuite/hardware/remote.py",
    "slmsuite/hardware/cameraslms/*.py",
    "slmsuite/hardware/cameras/camera.py",
    "slmsuite/hardware/cameras/simulated.py",
    "slmsuite/hardware/cameras/remote.py",
    "slmsuite/hardware/slms/slm.py",
    "slmsuite/hardware/slms/simulated.py",
    "slmsuite/hardware/slms/remote.py",
    "slmsuite/hardware/slms/segmented.py",
    "slmsuite/holography/**/*.py",
    "slmsuite/misc/*.py",
]

[tool.ruff]
required-version = ">=0.16"
line-length = 100
# target-version is inferred from project.requires-python.
# .venv, build, dist, and .gitignore'd paths are excluded by default.
extend-exclude = ["docs", "*.ipynb"]

[tool.ruff.format]
docstring-code-format = true               # format code blocks inside docstrings
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports/vars, undefined names)
    "I",    # isort (import sorting & grouping)
    "UP",   # pyupgrade (modernize syntax for py3.10+)
    "B",    # flake8-bugbear (likely bugs / footguns)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # misc lints
    "PERF", # perflint
    "NPY",  # numpy-specific lints
    "RUF",  # Ruff-specific
    "D",    # pydocstyle (numpy convention — see ignores below)
    "G",    # flake8-logging-format (lazy %-args, not f-strings, in logger calls)
    "PGH",  # pygrep-hooks (no blanket `# type: ignore` / `# noqa`)
    "PLE",  # pylint errors
    "RSE",  # flake8-raise (no needless `()` on raised exception classes)
    "FURB", # refurb (small modernizations)
    "PT006", "PT007", "PT011",  # pytest: parametrize style, and `raises` without `match=`
]
ignore = [
    "B028",    # no-explicit-stacklevel
    "SIM105",  # suppressible-exception (try-except-pass)
    "E501",    # line too long — formatter handles; docstrings/URLs may exceed
    "E741",    # ambiguous var name (l, I, O) — common in math/holography
    "B008",    # function call in default arg — np.array(...) defaults are fine
    "B905",    # zip without strict= — noisy for numeric code
    "SIM108",  # ternary-instead-of-if — often less readable for math
    "SIM117",  # combine nested with-statements — hurts readability w/ hardware
    "PERF203", # try/except in loop — often unavoidable around hardware I/O
    # pydocstyle — numpy convention already disables D107, D203, D212, D415, ...
    # Additionally drop the noisiest "missing" rules and prose-style rules:
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D102",    # missing docstring in public method
    "D103",    # missing docstring in public function
    "D104",    # missing docstring in public package
    "D105",    # missing docstring in magic method
    "D200",    # one-line docstring should fit on one line — cosmetic, lots of churn
    "D205",    # 1 blank line between summary and description
    "D400",    # missing trailing period — false positives on math/symbols
    "D401",    # imperative mood — too opinionated for scientific prose
]
# Rewriting `a + [b]` as `[*a, b]` changes meaning when `a` is an ndarray (broadcast add).
unfixable = ["RUF005"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]                        # re-exports & star-imports are intentional
"slmsuite/hardware/**/*.py" = ["F401"]                  # vendor SDK imports gated by try/except
"slmsuite/holography/algorithms/_header.py" = ["F401"]  # re-exports meant for star-import in other modules
"slmsuite/holography/algorithms/_*.py" = ["F403", "F405"]  # shared numpy/scipy/cupy symbols star-imported from _header
"slmsuite/misc/files.py" = ["F403"]                     # backwards-compat re-export shim
"slmsuite/misc/fitfunctions.py" = ["F403"]              # backwards-compat re-export shim
"slmsuite/hardware/cameras/template.py" = ["F821"]      # placeholder TODO markers
"slmsuite/hardware/slms/template.py" = ["F821"]         # placeholder TODO markers
"tests/**/*.py" = ["B011", "D", "SIM", "F403", "F405", "NPY002"]  # asserts, docstrings, star imports, and the global RNG that conftest seeds

[tool.ruff.lint.isort]
known-first-party = ["slmsuite"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"
