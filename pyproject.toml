[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slmsuite"
description = "Package for high-performance spatial light modulator (SLM) control and holography."
readme = "README_PYPI.md"
requires-python = ">=3.10"
authors = [
    { name = "Holodyne Labs, Inc.", email = "slmsuite@holodyne.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",
    "h5py",
    "tqdm",
]

# GPU acceleration (CuPy): ``pip install slmsuite[gpu]`` installs cupy-cuda13x.
# Sometimes, installation is made complicated by a pre-installed version of CUDA.
# You can find the CUDA version with ``nvcc --version`` in a terminal, and then
# install an installation of :mod:`cupy` specific to CUDA version ``YY`` with
# ``pip install cupy-cudaYYx``(see https://docs.cupy.dev/en/stable/install.html).
# For example:
#   pip install cupy-cuda12x   # CUDA 12.x
#   pip install cupy            # Build from source (any CUDA version)
#
# Some hardware drivers require vendor-specific SDKs that are not available on
# PyPI. Download the SDK installer from the vendor and follow the installation
# instructions. This might involve installing a wheel .whl or building from source.
#
#   PySpin           — FLIR/Teledyne Spinnaker SDK
#   thorlabs_tsi_sdk — Thorlabs ThorCam SDK
#   vmbpy            — Allied Vision Vimba X SDK
#   vimba            — Allied Vision Vimba SDK (legacy)

[project.optional-dependencies]
gpu = ["cupy-cuda13x"]
torch = ["torch"]
slms = [
    "pyglet",
    "hidapi",
    "pyyaml",
]
cameras = [
    "pylablib",
    "pymmcore",
    "pypylon",
    "instrumental-lib",
]
images = [
    "imageio",
    "pygifsicle",
    "av",
]
jupyter = [
    "jupyter",
    "ipywidgets",
    "ipyevents",
    "slmsuite[images]",
]
docs = [
    "nbsphinx",
    "IPython",
    "docutils",
    "sphinx",
    "sphinx_copybutton",
    "sphinx_last_updated_by_git",
    "requests",
    "pypandoc_binary",     # Bundles the pandoc binary that nbsphinx needs.
    "pydata-sphinx-theme",
    "sphinx_design",
    "sphinx-autodoc-typehints",
]
test = [
    "imageio",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-subtests",
    "pytest-notebook",
    "nbformat",
    "pyyaml",
    "ipywidgets",
]
dev = [
    "slmsuite[test]",
    "slmsuite[jupyter]",
    "slmsuite[docs]",
    "slmsuite[gpu]",
    "slmsuite[torch]",
    "slmsuite[slms]",
    "slmsuite[cameras]",
    "line-profiler",
    "snakeviz",
    "ruff==0.17.*",
]

[project.urls]
"Homepage" = "https://github.com/holodyne/slmsuite"
"Documentation" = "https://slmsuite.holodyne.com/en/latest/"

[tool.setuptools.dynamic]
version = { attr = "slmsuite.__version__" }

[tool.setuptools.packages.find]
include = ["slmsuite*"]

[tool.setuptools.package-data]
slmsuite = [
    "holography/toolbox/phase/cuda.cu",
    "hardware/slms/texasinstruments.yaml",
    "hardware/slms/meadowlark.csv",
]

[tool.uv]
# pyqt5-qt5 >= 5.15.3 dropped Windows wheels; cap to last working version.
constraint-dependencies = ["pyqt5-qt5<=5.15.2"]

[tool.coverage.run]
# Don't include hardware drivers in coverage reports, as we cannot autotest them.
include = [
    "slmsuite/*.py",
    "slmsuite/hardware/_common.py",
    "slmsuite/hardware/remote.py",
    "slmsuite/hardware/cameraslms/*.py",
    "slmsuite/hardware/cameras/camera.py",
    "slmsuite/hardware/cameras/simulated.py",
    "slmsuite/hardware/cameras/remote.py",
    "slmsuite/hardware/slms/slm.py",
    "slmsuite/hardware/slms/simulated.py",
    "slmsuite/hardware/slms/remote.py",
    "slmsuite/hardware/slms/segmented.py",
    "slmsuite/holography/**/*.py",
    "slmsuite/misc/*.py",
]

[tool.ruff]
required-version = "==0.17.*"  # keep in sync with the dev extra and CI
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE",      # misc lints
    "PERF",     # perflint
    "NPY",      # numpy
    "RUF",      # ruff-specific
    "D",        # pydocstyle (numpy convention)
    "G",        # logging format
    "PGH",      # pygrep-hooks
    "PLE",      # pylint errors
    "RSE",      # raise
    "PT006", "PT007", "PT011",  # pytest parametrize style, `raises` needs `match=`
]
ignore = [
    "E501",    # line length: the formatter handles code; docstrings and URLs may exceed
    "E741",    # ambiguous names (l, I, O) are standard in optics math
    "B008",    # function calls in defaults (np.array(...)) are fine
    "B028",    # warnings.warn without stacklevel
    "B905",    # zip without strict=
    "SIM105",  # try/except/pass is clearer than contextlib.suppress
    "SIM108",  # ternaries hurt readability in math
    "SIM117",  # nested with-statements read better around hardware
    "PERF203", # try/except in loops is unavoidable around hardware I/O
    "NPY002",  # legacy np.random keeps np.random.seed() reproducibility for users
    "D1",      # missing docstrings
    "D200",    # one-line docstring on one line
    "D205",    # blank line after summary
    "D401",    # imperative mood
]
# `a + [b]` -> `[*a, b]` changes meaning when `a` is an ndarray.
unfixable = ["RUF005"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]                           # re-exports and star-imports
"slmsuite/holography/algorithms/_header.py" = ["F401"]     # re-exports for star-import
"slmsuite/holography/algorithms/_*.py" = ["F403", "F405"]  # numpy/scipy/cupy symbols from _header
"slmsuite/misc/files.py" = ["F403"]                        # backwards-compatible shim
"slmsuite/misc/fitfunctions.py" = ["F403"]                 # backwards-compatible shim
"slmsuite/hardware/*/template.py" = ["F821"]               # TODO placeholders
"tests/**/*.py" = ["D", "SIM", "F403", "F405"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
